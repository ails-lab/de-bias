[project]
name = "de-bias"
version = "0.1.0"
description = "Detects outdated or harmful terms from the DE-BIAS vocabulary in cultural-heritage descriptions."
readme = "README.md"
requires-python = "==3.10.*"
# Transitive versions are pinned by uv.lock. Stanza and its requirements are newer than in
# requirements.txt; everything else matches it.
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.26.0",
    "pydantic==2.5.3",
    "requests==2.34.2",
    "stanza==1.15.0",
    "torch==2.1.2",
    # Not imported directly; used by Stanza's transformer-based (default_accurate) models.
    "transformers==4.45.2",
    "peft==0.13.2",
    "accelerate==0.32.1",
    "sentencepiece==0.1.99",
    "protobuf==7.36.2",
    "pyahocorasick==2.0.0",
    "levenshtein==0.26.1",
]

[dependency-groups]
# Offline vocabulary and model preparation (preprocess_vocab.sh, model_preprocessing/).
prep = ["pandas"]

[tool.uv]
package = false
default-groups = []
# Holds transitive packages at the versions in requirements.txt so the uv environment
# matches the pip one. Remove once the switch to uv is settled.
constraint-dependencies = [
    "annotated-types==0.6.0",
    "anyio==4.2.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "exceptiongroup==1.2.0",
    "filelock==3.13.1",
    "fsspec==2023.12.2",
    "h11==0.14.0",
    "idna==3.6",
    "Jinja2==3.1.3",
    "MarkupSafe==2.1.3",
    "mpmath==1.3.0",
    "nvidia-cublas-cu12==12.1.3.1",
    "nvidia-cuda-cupti-cu12==12.1.105",
    "nvidia-cuda-nvrtc-cu12==12.1.105",
    "nvidia-cuda-runtime-cu12==12.1.105",
    "nvidia-cudnn-cu12==8.9.2.26",
    "nvidia-cufft-cu12==11.0.2.54",
    "nvidia-curand-cu12==10.3.2.106",
    "nvidia-cusolver-cu12==11.4.5.107",
    "nvidia-cusparse-cu12==12.1.0.106",
    "nvidia-nccl-cu12==2.18.1",
    "nvidia-nvjitlink-cu12==12.3.101",
    "nvidia-nvtx-cu12==12.1.105",
    "pydantic_core==2.14.6",
    "safetensors==0.4.5",
    "sniffio==1.3.0",
    "starlette==0.35.1",
    "sympy==1.12",
    "tokenizers==0.20.1",
    "triton==2.1.0",
    "typing_extensions==4.9.0",
    "urllib3==2.1.0",
]
